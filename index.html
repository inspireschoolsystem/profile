/* =========================================================
   DEEP MERGE + PERSISTENCE
   ========================================================= */
function mergeDeep(base, extra){
  if (Array.isArray(extra)) return extra;
  if (extra && typeof extra === 'object'){
    const out = (base && typeof base === 'object' && !Array.isArray(base)) ? { ...base } : {};
    for (const k in extra) out[k] = (k in out) ? mergeDeep(out[k], extra[k]) : extra[k];
    return out;
  }
  return extra === undefined ? base : extra;
}

let DB = JSON.parse(JSON.stringify(DEFAULT_DB));
let syncState = 'local';

function setSyncBadge(state){
  syncState = state;
  const b = document.getElementById('syncBadge');
  if (!b) return;
  b.innerHTML = state === 'synced'
    ? '<span class="pulse-dot"></span> Cloud Synced'
    : '<i class="fa-solid fa-hard-drive text-amber-400"></i> Local Mode';
}

async function loadDB(){
  // 1) Try Supabase
  if (sb){
    try{
      const { data, error } = await sb.from('record').select('*').limit(1);
      if (!error && data && data.length && data[0].record){
        const parsed = JSON.parse(data[0].record);
        DB = mergeDeep(JSON.parse(JSON.stringify(DEFAULT_DB)), parsed);
        syncState = 'synced';
        localStorage.setItem('inspire_db_backup', JSON.stringify(DB));
        return;
      }
    }catch(e){ console.warn('[Supabase load]', e.message); }
  }
  // 2) LocalStorage fallback
  const local = localStorage.getItem('inspire_db_backup');
  if (local){
    try{ DB = mergeDeep(JSON.parse(JSON.stringify(DEFAULT_DB)), JSON.parse(local)); return; }catch(e){}
  }
  DB = JSON.parse(JSON.stringify(DEFAULT_DB));
}

let saveTimer = null;
function saveDB(){
  localStorage.setItem('inspire_db_backup', JSON.stringify(DB));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 900);
}

async function pushRemote(){
  if (!sb) return setSyncBadge('local');
  try{
    const json = JSON.stringify(DB);
    const { data, error } = await sb.from('record').update({ record: json }).not('record','is',null).select();
    if (error) throw error;
    if (!data || data.length === 0){
      const ins = await sb.from('record').insert({ record: json }).select();
      if (ins.error) throw ins.error;
    }
    setSyncBadge('synced');
  }catch(e){
    console.warn('[Supabase save]', e.message);
    setSyncBadge('local');
  }
}

let slideIdx = 0, slideTimer = null;
function startSlideshow(){
  clearInterval(slideTimer);
  const items = document.querySelectorAll('.slide-item');
  if (!items.length) return;
  slideIdx = 0;
  const go = i => {
    document.querySelectorAll('.slide-item').forEach((el,k)=>el.classList.toggle('opacity-0', k!==i));
    document.querySelectorAll('.slide-dot').forEach((d,k)=>{ d.classList.toggle('bg-white',k===i); d.classList.toggle('w-8',k===i); d.classList.toggle('bg-white/50',k!==i); d.classList.toggle('w-3',k!==i); });
  };
  go(0);
  slideTimer = setInterval(()=>{ slideIdx = (slideIdx+1) % document.querySelectorAll('.slide-item').length; go(slideIdx); }, 5000);
  window.goSlide = i => { slideIdx = i; go(i); };
}

function router(){
  const hash = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'home';
  const parts = hash.split('/');
  const route = parts[0];
  const param = parts.slice(1).join('/');

  if (route === 'portal'){
    showPortal(param || 'admin');
    return;
  }

  showSite();
  const main = document.getElementById('main');
  let html = '';

  switch(route){
    case 'about':    html = renderAbout(); break;
    case 'contact':  html = renderContact(); break;
    case 'vision':   html = renderVision(); break;
    case 'classes':  html = renderClasses(); break;
    case 'class':    html = renderClassDetail(param); break;
    case 'whyus':    html = renderWhyUs(); break;
    case 'notes':    html = renderNotes(); break;
    case 'teacher':  html = renderTeacherProfile(param); break;
    default:         html = renderHome();
  }

  main.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (route === 'home'){ galleryShown = 6; renderGallery(); startSlideshow(); }
  if (route === 'notes'){ renderNotesList(); }
  if (window.AOS) AOS.refreshHard();
  document.getElementById('mobileNav').classList.add('hidden');
  renderFooter();
}

        <a href="#/home" class="block text-center text-xs text-slate-400 hover:text-brand-500 mt-6 transition"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Website</a>
      </div>

  </div>`;

  if (type === 'student'){
    const cls = document.getElementById('loginClass');
    const fill = () => {
      const list = DB.students.filter(s=>s.className===cls.value);
      document.getElementById('loginStudent').innerHTML = list.map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.father)}</option>`).join('') || '<option value="">No students in this class</option>';
    };
    cls.onchange = fill; fill();
  }
}

function doAdminLogin(){
  const p = document.getElementById('loginPass').value;
  if (p === DB.settings.adminPassword){
    setSession({ role:'admin', name:'Administrator' });
    alertOk('Welcome Admin!', 'Access granted.');
    renderPortalDashboard('admin', getSession());
  } else alertErr('Wrong Password', 'Please try again.');
}

function doTeacherLogin(){
  const id = document.getElementById('loginTeacher').value;
  const p = document.getElementById('loginPass').value;
  const t = DB.teachers.find(x=>x.id===id);
  if (t && p === t.password){
    setSession({ role:'teacher', id:t.id, name:t.name });
    alertOk('Welcome, ' + t.name, 'Login successful.');
    renderPortalDashboard('teacher', getSession());
  } else alertErr('Login Failed', 'Incorrect password.');
}

function doStudentLogin(){
  const cls = document.getElementById('loginClass').value;
  const sid = document.getElementById('loginStudent').value;
  const st = DB.students.find(s=>s.id===sid);
  setSession({ role:'student', className: cls, studentId: sid, name: st ? st.name : cls });
  renderPortalDashboard('student', getSession());
}

function renderAdminPanel(){

    { id:'students', label:'Students', icon:'fa-user-graduate', fn:"adminGo('students')" },
    { id:'academics', label:'Academics', icon:'fa-book', fn:"adminGo('academics')" },

    { id:'settings', label:'Settings', icon:'fa-gear', fn:"adminGo('settings')" }

  s.hero.image = g('w_heroImg');
  s.about = g('w_about');
  s.vision = g('w_vision');

  s.principal.name = g('w_pName');
  s.principal.phone = g('w_pPhone');
  s.principal.pic = g('w_pPic');
  s.principal.message = g('w_pMsg');

  s.contact.email = g('w_cEmail');
  s.contact.whatsapp = g('w_cWa');
  s.contact.address = g('w_cAddr');

function addGalleryItem(){
  const t = document.getElementById('g_title').value.trim();
  const d = document.getElementById('g_desc').value.trim();
  const i = document.getElementById('g_img').value.trim() || IMG.g1;
  if (!t) return alertErr('Missing Title', 'Please enter an event title.');
  DB.settings.gallery.push({ title:t, desc:d, img:i });
  saveDB(); renderAdminPanel(); toast('success','Gallery item added');
}
function removeGalleryItem(i){
  DB.settings.gallery.splice(i,1);
  saveDB(); renderAdminPanel(); toast('success','Item removed');
}

function delRecord(table, id){
  Swal.fire({ title:'Delete this record?', icon:'warning', showCancelButton:true,
    confirmButtonColor:'#e11d48', confirmButtonText:'Delete',
    background: document.documentElement.classList.contains('dark') ? '#0f172a' : '#fff',
    color: document.documentElement.classList.contains('dark') ? '#e2e8f0' : '#0f172a'
  }).then(r=>{
    if (r.isConfirmed){ DB[table] = DB[table].filter(x=>x.id!==id); saveDB(); renderAdminPanel(); toast('success','Record deleted'); }
  });
}

function addFee(){
  const g = id => document.getElementById(id).value;
  if (!g('f_student') || !g('f_amount')) return alertErr('Missing Fields','Student name and amount are required.');
  DB.fees.push({ id:uid('fee'), student:g('f_student'), father:g('f_father'), contact:g('f_contact'),
    className:g('f_class'), amount:Number(g('f_amount')), month:g('f_month')||today().slice(0,7), date:today() });
  saveDB(); renderAdminPanel(); alertOk('Fee Added','Record saved successfully.');
}

function changeAdminPass(){
  const o = document.getElementById('set_old').value;
  const n = document.getElementById('set_new').value;
  if (o !== DB.settings.adminPassword) return alertErr('Incorrect','Current password is wrong.');
  if (n.length < 4) return alertErr('Too Short','Password must be at least 4 characters.');
  DB.settings.adminPassword = n; saveDB(); alertOk('Updated','Admin password changed.');
}

function saveIdentity(){
  DB.settings.schoolName = document.getElementById('set_name').value;
  DB.settings.location = document.getElementById('set_loc').value;
  DB.settings.tagline = document.getElementById('set_tag').value;
  saveDB(); renderNav(); renderFooter(); alertOk('Saved','School identity updated.');
}

function exportDB(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'inspire-school-db.json'; a.click();
  toast('success','Database exported');
}

function resetDB(){
  Swal.fire({ title:'Reset everything?', text:'This will erase all records and restore defaults.',
    icon:'warning', showCancelButton:true, confirmButtonColor:'#e11d48', confirmButtonText:'Yes, reset',
    background: document.documentElement.classList.contains('dark') ? '#0f172a' : '#fff',
    color: document.documentElement.classList.contains('dark') ? '#e2e8f0' : '#0f172a' })
  .then(r=>{ if (r.isConfirmed){ DB = JSON.parse(JSON.stringify(DEFAULT_DB)); saveDB(); renderAdminPanel(); toast('success','Database reset'); } });
}

function renderTeacherPanel(sess){
  const t = DB.teachers.find(x=>x.id===sess.id);
  if (!t) return logoutPortal();
  const nav = [
    { id:'dashboard', label:'Dashboard', icon:'fa-gauge-high', fn:"teacherGo('dashboard')" },
    { id:'class', label:'Class Management', icon:'fa-users', fn:"teacherGo('class')" },
    { id:'attendance', label:'Attendance', icon:'fa-calendar-check', fn:"teacherGo('attendance')" },
    { id:'academics', label:'Academics', icon:'fa-book', fn:"teacherGo('academics')" },
    { id:'activities', label:'Activities', icon:'fa-images', fn:"teacherGo('activities')" }
  ];
  const content = {
    dashboard: teacherDashboardHTML,
    class: teacherClassHTML,
    attendance: teacherAttendanceHTML,
    academics: teacherAcademicsHTML,
    activities: teacherActivitiesHTML
  }[teacherTab] || teacherDashboardHTML;

  document.getElementById('portalRoot').innerHTML =
    portalShell('Teacher Panel', t.name, nav, teacherTab, content(t));
  setSyncBadge(syncState);
  if (window.AOS) AOS.refreshHard();
}

function teacherGo(tab){ teacherTab = tab; renderTeacherPanel(getSession()); }

function renderStudentPanel(sess){
  const nav = [
    { id:'overview', label:'Overview', icon:'fa-gauge-high', fn:"studentGo('overview')" },
    { id:'notes', label:'Notes & Tests', icon:'fa-book', fn:"studentGo('notes')" },
    { id:'results', label:'My Results', icon:'fa-chart-line', fn:"studentGo('results')" },
    { id:'announcements', label:'Announcements', icon:'fa-bullhorn', fn:"studentGo('announcements')" },
    { id:'teachers', label:'Our Teachers', icon:'fa-chalkboard-user', fn:"studentGo('teachers')" }
  ];
  const content = {
    overview: studentOverviewHTML,
    notes: studentNotesHTML,
    results: studentResultsHTML,
    announcements: studentAnnouncementsHTML,
    teachers: studentTeachersHTML
  }[studentTab] || studentOverviewHTML;

  document.getElementById('portalRoot').innerHTML =
    portalShell('Student & Parent', sess.name || sess.className, nav, studentTab, content(sess));
  setSyncBadge(syncState);
  if (window.AOS) AOS.refreshHard();
}

function studentResultsHTML(sess){
  const st = DB.students.find(s=>s.id===sess.studentId);
  const list = st ? DB.marks.filter(m=>m.studentId===st.id) : DB.marks.filter(m=>m.className===sess.className);
  const total = list.reduce((a,m)=>a+m.obtained,0);
  const max = list.reduce((a,m)=>a+m.total,0);
  const pct = max ? Math.round(total/max*100) : 0;
  return `
  <div class="card p-6 mb-6 text-center">
    <div class="relative w-40 h-40 mx-auto">
      <svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">

        <circle cx="60" cy="60" r="52" fill="none" stroke="#1e6fd9" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="${2*Math.PI*52*(1-pct/100)}" style="transition:stroke-dashoffset 1.2s ease"/>
      </svg>
      <div class="absolute inset-0 grid place-items-center">
        <div><p class="text-3xl font-extrabold text-brand-600 dark:text-brand-300">${pct}%</p>
        <p class="text-[11px] uppercase tracking-widest text-slate-400">Overall</p></div>
      </div>
    </div>
    <p class="mt-3 text-sm text-slate-500 dark:text-slate-400">${total} / ${max} marks obtained</p>
  </div>

  <div class="card p-6">
    <h3 class="font-extrabold text-lg mb-4"><i class="fa-solid fa-chart-line text-brand-500 mr-2"></i>Result Sheet</h3>
    <div class="overflow-x-auto scrollbar-thin">
      <table class="w-full text-sm">
        <thead class="bg-slate-100 dark:bg-slate-800 text-left"><tr>
          <th class="p-3">Subject</th><th class="p-3">Exam</th><th class="p-3">Obtained</th><th class="p-3">Total</th><th class="p-3">%</th><th class="p-3">Date</th></tr></thead>
        <tbody>
          ${list.map(m=>`<tr class="border-t border-slate-100 dark:border-slate-800">
            <td class="p-3 font-semibold">${esc(m.subject)}</td><td class="p-3">${esc(m.exam)}</td>
            <td class="p-3">${m.obtained}</td><td class="p-3">${m.total}</td>
            <td class="p-3 font-bold text-brand-600 dark:text-brand-300">${Math.round(m.obtained/m.total*100)}%</td>
            <td class="p-3">${esc(m.date)}</td></tr>`).join('') || '<tr><td colspan="6" class="p-6 text-center text-slate-400">No results published yet.</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}

function studentAnnouncementsHTML(sess){
  const list = DB.announcements.filter(a=>['All','Students','Parents'].includes(a.target));
  return `
  <div class="card p-6">
    <h3 class="font-extrabold text-lg mb-4"><i class="fa-solid fa-bullhorn text-brand-500 mr-2"></i>Announcements</h3>
    <div class="space-y-3">
      ${list.slice().reverse().map(a=>`
        <div class="p-4 rounded-xl bg-brand-50 dark:bg-slate-800/60 border-l-4 border-brand-500 hover:translate-x-1 transition">
          <p class="text-sm">${esc(a.text)}</p>
          <p class="text-[11px] text-slate-400 mt-1">${esc(a.date)} • For: ${esc(a.target)}</p>
        </div>`).join('') || '<p class="text-sm text-slate-400 text-center py-8">No announcements.</p>'}
    </div>
  </div>`;
}

function studentTeachersHTML(sess){
  return `
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
    ${DB.teachers.map(t=>`
      <div class="card p-5 text-center group">
        <img src="${esc(t.pic||IMG.avatar)}" class="w-24 h-24 rounded-2xl object-cover mx-auto group-hover:scale-105 transition" alt=""/>
        <p class="font-bold mt-4">${esc(t.name)}</p>
        <p class="text-xs text-brand-500">${esc(t.subject)}</p>
        <p class="text-[11px] text-slate-400 mt-1">${esc(t.education)}</p>
        <a href="#/teacher/${t.id}" class="btn btn-primary text-xs mt-4 w-full !py-2"><i class="fa-solid fa-user"></i> Profile</a>

}

/* =========================================================
   BOOT
   ========================================================= */
(async function boot(){
  applyTheme();
  renderNav();

  await loadDB();

  // hide loader
  setTimeout(()=>{
    const l = document.getElementById('loader');
    l.classList.add('hide');
    const site = document.getElementById('site');
    site.classList.remove('opacity-0');
    site.classList.add('opacity-100');
    setTimeout(()=>l.remove(), 900);
  }, 1200);

  AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 60 });

  renderFooter();
  router();
  window.addEventListener('hashchange', router);

  // re-render nav/footer when data changes elsewhere
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (a) document.getElementById('mobileNav')?.classList.add('hidden');
  });
})();
</script>
</body>
</html>
